name: Build Hisab360 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Domain unit tests
        run: npm test
      - name: Firestore security rules tests
        run: npm run test:rules

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web assets
        run: npm run build:web
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Decode release keystore
        run: echo "${{ secrets.H360_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/h360.p12"
      - name: Build signed release APK
        env:
          H360_KEYSTORE: ${{ runner.temp }}/h360.p12
          H360_STORE_PASS: ${{ secrets.H360_STORE_PASS }}
          H360_KEY_ALIAS: ${{ secrets.H360_KEY_ALIAS }}
          H360_KEY_PASS: ${{ secrets.H360_KEY_PASS }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5
          ls -lh android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hisab360-v7.2.3-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
